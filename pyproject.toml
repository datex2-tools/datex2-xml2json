[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "datex2-xml2json"
dynamic = ["version"]
authors = [
  { name="Holger Bruch", email="hb@mfdz.de" },
]
description = "PoC converting DATEX2 v2 (situation) publications to various output formats."
readme = "README.md"
keywords = ["DATEX2", "roadworks", "road closures", "GeoJSON", "Geoparquet", "WAZE-CIFS"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: File Formats",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "EUPL-1.2"
license-files = ["LICENSE.md"]

dependencies = [
    "jsonschema>=4.26.0",
    "check-jsonschema>=0.38.2",
    "jsonata-python>=0.7.0",
    "geoparquet-io>=1.6.0",
    "rs-xml2json>=0.2.0"
]

[project.urls]
Homepage = "https://github.com/datex2-tools/datex2-xml2json"
Issues = "https://github.com/datex2-tools/datex2-xml2json/issues"

[tool.setuptools]
packages = ["datex2_xml2json"]


[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "S", # flake8-bandit
    "ASYNC", # flake8-async
    "DTZ", # flake8-datetimez
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    "INP", # flake8-no-pep420 (missing __init__.py)
    "PIE", # flake8-pie
    "T20", # flake8-print
    "Q", # flake8-quotes
    "TID", # flake8-tidy-imports
    "FLY", # flynt (use f-string instead of static join)
]

ignore = [
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "ISC001", # single-line-implicit-string-concatenation - conflicts with formatter
]

fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Enable preview rules since a lot of basic pycodestyle rules are in preview mode for some reason
preview = true

[tool.ruff.lint.per-file-ignores]
# Ignore unused and unsorted imports in init modules
"__init__.py" = ["F401", "I001"]

# Rule exceptions for unit/integration tests
"tests/*" = [
    # Allow assert
    "S101",
    # Ignore unsafe practices like hardcoded passwords
    "S101", "S105", "S106",
    # Don't require __init__.py files
    "INP",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["datex2_xml2json"]

[[tool.mypy.overrides]]
# See https://github.com/HBNetwork/python-decouple/issues/122
module = [
    "jsonata",
    "check_jsonschema.checker",
    "check_jsonschema.file_wrapper",
    "check_jsonschema.formats",
    "check_jsonschema.instance_loader",
    "check_jsonschema.regex_variants",
    "check_jsonschema.reporter",
    "check_jsonschema.schema_loader",
    "geoparquet_io",
    "rs_xml2json",
    "pyarrow",
    "shapely.geometry",
]
ignore_missing_imports = true
